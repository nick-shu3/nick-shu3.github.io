name: Verify portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate source and release boundary
        run: |
          node --check docs/catalog.js
          node --check docs/games/kagi-to-tobira/app.js
          node --check docs/games/squad-front/app.js
          node tests/release.cjs
          node tests/squad.cjs
          node tests/kagi.cjs
